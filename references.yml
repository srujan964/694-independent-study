KnuthDynamicHuffman:
  type: article
  title: Dynamic huffman coding
  author: Knuth, Donald E
  date: 1985
  page-range: 163-180
  url: https://www.sciencedirect.com/science/article/pii/0196677485900367
  serial-number:
    doi: https://doi.org/10.1016/0196-6774(85)90036-7
    issn: 0196-6774
  abstract: This note shows how to maintain a prefix code that remains optimum as the weights change. A Huffman tree with nonnegative integer weights can be represented in such a way that any weight w at level l can be increased or decreased by unity in O(l) steps, preserving minimality of the weighted path length. One-pass algorithms for file compression can be based on such a representation.
  parent:
    type: periodical
    title: Journal of Algorithms
    issue: 2
    volume: 6
DynamicHuffmanVitter:
  type: article
  title: Design and analysis of dynamic Huffman codes
  author: Vitter, Jeffrey Scott
  date: 1987-10
  page-range: 825-845
  url: https://doi.org/10.1145/31846.42227
  serial-number:
    doi: 10.1145/31846.42227
    issn: 0004-5411
  abstract: A new one-pass algorithm for constructing dynamic Huffman codes is introduced and analyzed. We also analyze the one-pass algorithm due to Faller, Gallager, and Knuth. In each algorithm, both the sender and the receiver maintain equivalent dynamically varying Huffman trees, and the coding is done in real time. We show that the number of bits used by the new algorithm to encode a message containing t letters is < t bits more than that used by the conventional two-pass Huffman scheme, independent of the alphabet size. This is best possible in the worst case, for any one-pass Huffman method. Tight upper and lower bounds are derived. Empirical tests show that the encodings produced by the new algorithm are shorter than those of the other one-pass algorithm and, except for long messages, are shorter than those of the two-pass method. The new algorithm is well suited for on-line encoding/decoding in data networks and for tile compression.
  parent:
    type: periodical
    title: J. ACM
    publisher:
      name: Association for Computing Machinery
      location: New York, NY, USA
    issue: 4
    volume: 34

